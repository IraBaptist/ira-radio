<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#111111">
  <title>Ira Bulldogs Scoreboard Control</title>
  <link rel="stylesheet" href="styles.css?v=2000">
</head>
<body>
  <main class="shell">
    <header class="topbar">
      <div>
        <div class="eyebrow">IRA BULLDOGS RADIO</div>
        <h1>Scoreboard Control</h1>
      </div>
      <div class="status-stack">
        <span class="version">V2.0.0 SIMPLE</span>
        <span id="publicStatus" class="sync-status">Public: checking…</span>
      </div>
    </header>

    <section class="scoreboard" aria-label="Scoreboard controls">
      <article class="team-card ira-card" id="iraCard">
        <div class="team-name">IRA BULLDOGS</div>
        <input id="iraScore" class="score-input" type="number" min="0" step="1" inputmode="numeric" aria-label="Ira score">
        <div class="score-buttons">
          <button type="button" data-score="ira:-1">−1</button>
          <button type="button" data-score="ira:1">+1</button>
          <button type="button" data-score="ira:2">+2</button>
          <button type="button" data-score="ira:6">+6</button>
        </div>
        <button id="iraPossession" class="possession-btn" type="button">🏈 IRA HAS THE BALL</button>
      </article>

      <article class="team-card opponent-card" id="opponentCard">
        <input id="opponentName" class="opponent-name" maxlength="40" aria-label="Opponent name" placeholder="Opponent">
        <input id="opponentScore" class="score-input" type="number" min="0" step="1" inputmode="numeric" aria-label="Opponent score">
        <div class="score-buttons">
          <button type="button" data-score="opponent:-1">−1</button>
          <button type="button" data-score="opponent:1">+1</button>
          <button type="button" data-score="opponent:2">+2</button>
          <button type="button" data-score="opponent:6">+6</button>
        </div>
        <button id="opponentPossession" class="possession-btn" type="button">🏈 OPPONENT HAS THE BALL</button>
      </article>
    </section>

    <section class="card possession-clear">
      <button id="clearPossession" type="button" class="secondary wide">Clear Possession</button>
    </section>

    <section class="card opponent-settings">
      <div class="section-heading">
        <div>
          <div class="eyebrow">OPPONENT DISPLAY</div>
          <h2>Name & Score Color</h2>
        </div>
      </div>
      <div class="color-row">
        <label for="opponentColor">Opponent color</label>
        <input id="opponentColor" type="color" value="#1f5fbf" aria-label="Opponent score color">
        <button id="applyOpponent" type="button">Save Opponent Display</button>
      </div>
      <div class="preset-row" aria-label="Opponent color presets">
        <button type="button" class="color-preset" data-color="#000000">Black</button>
        <button type="button" class="color-preset" data-color="#1f5fbf">Blue</button>
        <button type="button" class="color-preset" data-color="#a4161a">Red</button>
        <button type="button" class="color-preset" data-color="#6a1b9a">Purple</button>
        <button type="button" class="color-preset" data-color="#1b5e20">Green</button>
        <button type="button" class="color-preset" data-color="#7a4a21">Brown</button>
      </div>
    </section>

    <section class="card updates-card">
      <div class="section-heading">
        <div>
          <div class="eyebrow">PUBLIC FEED</div>
          <h2>Post an Update</h2>
        </div>
      </div>
      <textarea id="newUpdate" rows="3" maxlength="280" placeholder="Example: Ira scores 6 points!&#10;Example: Timeout Ira."></textarea>
      <div class="composer-actions">
        <button id="postUpdate" type="button" class="primary">Post Update</button>
        <span id="charCount" class="muted">0 / 280</span>
      </div>
      <div id="updatesList" class="updates-list"></div>
    </section>

    <section class="card utility-card">
      <button id="publishNow" type="button" class="secondary">Send Everything Now</button>
      <button id="resetGame" type="button" class="danger-ghost">Reset Scoreboard</button>
    </section>
  </main>

  <dialog id="editDialog">
    <form method="dialog" id="editForm">
      <h2>Edit Update</h2>
      <textarea id="editUpdateText" rows="4" maxlength="280"></textarea>
      <div class="dialog-actions">
        <button value="cancel" class="secondary">Cancel</button>
        <button id="saveEdit" value="default" class="primary">Save Changes</button>
      </div>
    </form>
  </dialog>

  <dialog id="confirmDialog">
    <form method="dialog">
      <h2 id="confirmTitle">Confirm</h2>
      <p id="confirmText"></p>
      <div class="dialog-actions">
        <button value="cancel" class="secondary">Cancel</button>
        <button id="confirmYes" value="default" class="danger">Delete</button>
      </div>
    </form>
  </dialog>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="config.js"></script>
  <script src="app.js?v=2000"></script>
</body>
</html>
